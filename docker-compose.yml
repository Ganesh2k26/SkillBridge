version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: skillbridge_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: skillbridge_db
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    container_name: skillbridge_backend
    restart: always
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/skillbridge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JWT_SECRET: SkillBridgeSecretKeyMustBe256BitsForHMACSHA256SecurityPurpose!
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      mysql: { condition: service_healthy }

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    container_name: skillbridge_frontend
    restart: always
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  mysql_data:
