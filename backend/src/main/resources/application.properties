spring.application.name=skillbridge
server.port=8080

# Load local overrides when present (gitignored application-local.properties)
spring.config.import=optional:classpath:application-local.properties

# ── MySQL (override via env or application-local.properties) ───────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skillbridge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ─────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:SkillBridgeSecretKeyMustBe256BitsForHMACSHA256SecurityPurpose!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Gemini AI ───────────────────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}

# ── Swagger ─────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Seed data on startup ────────────────────────────────────────────────────
app.seed-data=${APP_SEED_DATA:true}

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.ganesh=INFO
logging.level.org.springframework.security=WARN
spring.main.allow-circular-references=true
