services:
  - type: web
    name: skillbridge-backend
    env: java
    plan: free
    buildCommand: cd backend && mvn -DskipTests package
    startCommand: java -jar backend/target/skillbridge-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_VERSION
        value: 21
